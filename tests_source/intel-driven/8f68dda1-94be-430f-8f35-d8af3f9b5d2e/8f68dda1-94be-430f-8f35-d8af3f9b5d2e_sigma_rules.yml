# Qilin BYOVD driver staging, service creation, and native loading.
# Confidence: High for known drivers and NtLoadDriver; Medium for a generic service ImagePath.
# False positives: Administrative driver installation, hardware updates, and security research.
# Tuning: Validate signer/hash and correlate a new service with a driver drop within 5 minutes.
title: Qilin BYOVD Driver Staging Service and Native Load
id: a7d7c4b1-657e-4f78-a9df-45880a5bf421
status: experimental
description: Detects rwdrv/hlpdrv drops, kernel driver service configuration, known driver loads, and direct NtLoadDriver/ZwLoadDriver API telemetry. Confidence is high for named artifacts and native-load APIs; a generic service ImagePath requires administrative-change review.
references:
  - https://blog.talosintelligence.com/qilin-edr-killer/
  - https://attack.mitre.org/techniques/T1211/
  - https://attack.mitre.org/techniques/T1562/001/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
  - attack.defense-evasion
  - attack.t1211
  - attack.t1562.001
logsource:
  product: windows
detection:
  selection_driver_drop:
    EventID: 11
    TargetFilename|endswith:
      - '\rwdrv.sys'
      - '\hlpdrv.sys'
  selection_kernel_service:
    EventID:
      - 1
      - 4688
    CommandLine|re: '(?i)\bsc(?:\.exe)?\s+create\s+\S+.*\btype\s*=\s*kernel\b'
  selection_service_registry:
    EventID:
      - 12
      - 13
      - 14
      - 4657
    TargetObject|contains: '\services\'
    Details|contains: '.sys'
  selection_native_load:
    ApiName:
      - NtLoadDriver
      - ZwLoadDriver
  selection_known_driver_load:
    EventID: 6
    ImageLoaded|endswith:
      - '\rwdrv.sys'
      - '\hlpdrv.sys'
  condition: 1 of selection_*
falsepositives:
  - Approved hardware and driver installation workflows
  - Driver-development or BYOVD research systems
level: critical
confidence: high
