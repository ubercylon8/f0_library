# Qilin ransomware encryption and recovery inhibition.
# Confidence: High for recovery commands or an encryption burst; Medium for one .qilin file event.
# False positives: Backup maintenance, recovery administration, or an unrelated application using the same suffix.
# Tuning: Alert on recovery commands immediately; require at least three .qilin files per process in two minutes for a high-confidence encryption burst.
title: Qilin File Encryption and Recovery Inhibition
id: 2c66c37b-c27c-4325-9d60-b7a2ef15a88e
status: experimental
description: Detects creation of Qilin-suffixed files and recovery notes, vssadmin shadow-copy deletion, and bcdedit recovery disablement. Correlate extension matches by process and burst volume to reduce benign suffix collisions.
references:
  - https://attack.mitre.org/techniques/T1486/
  - https://attack.mitre.org/techniques/T1490/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
  - attack.impact
  - attack.t1486
  - attack.t1490
logsource:
  product: windows
detection:
  selection_encrypted_file:
    EventID: 11
    TargetFilename|endswith: '.qilin'
  selection_recovery_note:
    EventID: 11
    TargetFilename|endswith: '\README-RECOVER.txt'
  selection_shadow_delete:
    EventID:
      - 1
      - 4688
    Image|endswith: '\vssadmin.exe'
    CommandLine|re: '(?i)\bdelete\b.*\bshadows\b'
  selection_recovery_disable:
    EventID:
      - 1
      - 4688
    Image|endswith: '\bcdedit.exe'
    CommandLine|re: '(?i)\brecoveryenabled\s+no\b'
  condition: 1 of selection_*
falsepositives:
  - Approved backup maintenance and Windows recovery administration
  - Benign software using a .qilin suffix or similarly named recovery note
level: critical
confidence: high
