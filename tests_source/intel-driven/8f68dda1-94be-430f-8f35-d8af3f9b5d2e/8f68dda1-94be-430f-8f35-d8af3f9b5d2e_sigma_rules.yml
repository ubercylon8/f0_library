# Qilin discovery, DLL sideloading, and remote-thread behavior.
# Confidence: High for sideload/injection branches; Medium for discovery-only matches.
# False positives: Inventory tools, portable Foxit packages, debuggers, profilers, and security software.
# Tuning: Validate the loaded DLL signer/path and remote-thread source; allowlist approved management tools by signer and parent.
title: Qilin Discovery Foxit Sideload and Svchost Remote Thread
id: d524d0c7-bb2f-49a2-a17c-b2c2d062c3b5
status: experimental
description: Detects SecurityCenter2 and OS discovery, FoxitPDFReader loading msimg32 outside Windows system directories, pwndll loading in svchost, and Sysmon remote-thread creation targeting svchost.
references:
  - https://blog.talosintelligence.com/qilin-edr-killer/
  - https://attack.mitre.org/techniques/T1518/001/
  - https://attack.mitre.org/techniques/T1082/
  - https://attack.mitre.org/techniques/T1055/
  - https://attack.mitre.org/techniques/T1574/002/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
  - attack.discovery
  - attack.defense-evasion
  - attack.t1518.001
  - attack.t1082
  - attack.t1055
  - attack.t1574.002
logsource:
  product: windows
detection:
  selection_security_discovery:
    EventID:
      - 1
      - 4688
    CommandLine|re: '(?i)(SecurityCenter2.*AntiVirusProduct|AntiVirusProduct.*SecurityCenter2)'
  selection_system_discovery:
    EventID:
      - 1
      - 4688
    CommandLine|contains: 'Win32_OperatingSystem'
  selection_sideload:
    EventID: 7
    Image|endswith: '\FoxitPDFReader.exe'
    ImageLoaded|endswith: '\msimg32.dll'
  filter_sideload_system:
    ImageLoaded|startswith:
      - 'C:\Windows\System32\'
      - 'C:\Windows\SysWOW64\'
  selection_injected_module:
    EventID: 7
    Image|endswith: '\svchost.exe'
    ImageLoaded|endswith: '\pwndll.dll'
  selection_remote_thread:
    EventID: 8
    TargetImage|endswith: '\svchost.exe'
  condition: 1 of selection_*discovery or (selection_sideload and not 1 of filter_sideload_*) or selection_injected_module or selection_remote_thread
falsepositives:
  - Approved inventory and vulnerability-management software
  - Portable or repackaged Foxit installations
  - Debuggers, profilers, accessibility tools, and security products creating remote threads
level: high
confidence: high
