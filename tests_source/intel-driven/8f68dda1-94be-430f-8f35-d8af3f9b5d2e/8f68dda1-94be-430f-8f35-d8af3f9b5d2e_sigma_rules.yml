logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith:
      - '\MsMpEng.exe'
      - '\CSFalconService.exe'
      - '\CrowdStrike.exe'
      - '\SentinelAgent.exe'
      - '\MsSense.exe'
