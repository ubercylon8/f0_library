# Qilin LSASS memory-read access.
# Confidence: High for an untrusted source requesting PROCESS_VM_READ.
# False positives: EDR, credential-protection, crash-dump, and support tools.
# Tuning: Exclusions must combine a verified signer, full path, and expected access mask; never exclude LSASS access by process name alone.
title: Qilin LSASS PROCESS VM READ Access
id: f90b0111-c523-4c82-8063-a3fb638120f1
status: experimental
description: Detects a process access handle to LSASS whose granted-access mask includes PROCESS_VM_READ (0x10), including access attempted after enabling SeDebugPrivilege. A granted handle does not alone prove that memory was read or dumped.
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess|re: '(?i)^0x[0-9a-f]*[13579bdf][0-9a-f]$'
  condition: selection
falsepositives:
  - Endpoint security and credential-protection products
  - Approved crash-dump, debugging, and support utilities
level: high
confidence: high
---
# Qilin security-process termination handle access.
# Confidence: High for an unexpected non-vendor source with PROCESS_TERMINATE.
