# ============================================================
# Sigma Rule: ssh.exe PermitLocalCommand download cradle
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1105
# ============================================================
title: ssh.exe with PermitLocalCommand and LocalCommand Used as Download Cradle
id: 8b4d0f52-1e6a-4c93-8d75-4f0b8a3e6c14
status: experimental
description: >
    Detects the Windows OpenSSH client invoked with PermitLocalCommand=yes
    and a LocalCommand= option carrying a download/execution command — the
    RedFlick ingress-tool-transfer cradle where ssh client options execute a
    client-side command (e.g. curl.exe download of an MSI) upon connect.
references:
    - https://attack.mitre.org/techniques/T1105/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith:
            - '\ssh.exe'
    selection_permit:
        CommandLine|contains:
            - 'PermitLocalCommand=yes'
            - 'PermitLocalCommand yes'
    selection_local:
        CommandLine|contains: 'LocalCommand='
    condition: all of selection_*
falsepositives:
    - Uncommon legitimate admin automation using ssh LocalCommand; whitelist dedicated admin accounts and jump-host tooling
level: high

