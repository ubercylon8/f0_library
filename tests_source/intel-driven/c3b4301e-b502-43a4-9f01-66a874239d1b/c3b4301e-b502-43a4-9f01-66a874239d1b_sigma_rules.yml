# ============================================================
# Sigma Rule: LNK shortcut masquerading as a document (double extension)
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1204.002, T1036.008
# ============================================================
title: LNK File Masquerading as PDF or Office Document via Double Extension
id: 5e1a7c2f-8b3d-4f69-9a42-1c7e5d0b3f81
status: experimental
description: >
    Detects the creation of a Windows shortcut using a double extension to
    masquerade as a document (e.g. Event_Invitation.pdf.lnk), the RedFlick
    initial-access lure delivered in password-protected archives attached to
    event-invite phishing against think tanks and NGOs.
references:
    - https://attack.mitre.org/techniques/T1204/002/
    - https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.execution
    - attack.t1204.002
    - attack.defense_evasion
    - attack.t1036.008
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|endswith: '.lnk'
    selection_docext:
        TargetFilename|contains:
            - '.pdf.lnk'
            - '.doc.lnk'
            - '.docx.lnk'
            - '.xls.lnk'
            - '.xlsx.lnk'
            - '.jpg.lnk'
            - '.png.lnk'
            - '.txt.lnk'
    condition: selection and 1 of selection_docext_*
falsepositives:
    - Users manually renaming shortcuts
    - Rare third-party software distribution shortcuts
level: high

