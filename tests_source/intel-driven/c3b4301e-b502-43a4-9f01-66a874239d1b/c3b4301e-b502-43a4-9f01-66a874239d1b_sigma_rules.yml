# ============================================================
# Sigma Rule: System curl.exe downloading payload files
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1105
# ============================================================
title: System curl.exe Ingress Transfer of MSI/EXE/PDF Payload to Disk
id: 9c5e1a63-2f7b-4da4-9e86-5a1c9b4f7d25
status: experimental
description: >
    The System32 curl.exe binary invoked with an output flag to write
    executables, installers or documents to disk from a remote URL — the
    RedFlick transfer primitive used to fetch setup.msi and the weaponized
    invite.pdf.
references:
    - https://attack.mitre.org/techniques/T1105/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.command_and_control
    - attack.t1105
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|startswith: 'C:\Windows\System32\curl.exe'
    selection_output:
        CommandLine|contains:
            - ' -o '
            - ' --output '
    selection_payload:
        CommandLine|contains:
            - '.msi'
            - '.exe'
            - '.pdf'
            - '.zip'
            - '.rar'
            - '.ps1'
            - '.bat'
    selection_remote:
        CommandLine|contains:
            - 'http://'
            - 'https://'
            - 'ftp://'
    condition: all of selection_*
falsepositives:
    - Software updaters and package managers using system curl
    - Legitimate administrator download scripts
level: medium

