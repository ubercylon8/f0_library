# ============================================================
# Sigma Rule: msiexec silent install from user-writable path or unusual parent
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1218.007
# ============================================================
title: Silent msiexec Installation of Package from User-Writable Path
id: 1e7a3c85-4b9d-4fc6-90a8-7c3e1b6f9f47
status: experimental
description: >
    msiexec.exe invoked with /i and silent flags (/q, /qn, /quiet) to install
    an MSI located in a user-writable path or spawned by a non-standard
    parent — the RedFlick MSI install step whose custom actions establish
    persistence.
references:
    - https://attack.mitre.org/techniques/T1218/007/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.defense_evasion
    - attack.t1218.007
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\msiexec.exe'
    selection_install:
        CommandLine|contains: ' /i'
    selection_silent:
        CommandLine|contains:
            - '/q'
            - '/quiet'
    selection_userpath:
        CommandLine|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\ProgramData\'
    filter_legit_parents:
        ParentImage|endswith:
            - '\explorer.exe'
            - '\msiexec.exe'
            - '\ccmexec.exe'
            - '\TrustedInstaller.exe'
            - '\svchost.exe'
    condition: selection_image and selection_install and selection_silent and selection_userpath and not 1 of filter_*
falsepositives:
    - User-initiated silent installs of legitimate software
    - Chocolatey and similar package managers
level: medium

