# ============================================================
# Sigma Rule: CosmicPulse .mollis registry payload staging
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1218.011
# ============================================================
title: Payload Staging in HKCU Software Classes .mollis Registry Key
id: 5c1e7a29-8f3b-4d0a-84ec-1a7c5f0d3d8b
status: experimental
description: >
    Detects writes to HKCU\Software\Classes\.mollis — the CosmicPulse
    downloader's staging key holding an AES-ECB-encrypted, base64-encoded
    payload/config (often in the default value) that the bootstrapper later
    recovers and decrypts. A Classes key shaped like a benign file extension
    holding a large base64 blob is both a campaign identifier and a fileless
    payload-staging behavior.
references:
    - https://attack.mitre.org/techniques/T1218/011/
    - https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: registry_set
    product: windows
detection:
    selection:
        TargetObject|contains: '\Software\Classes\.mollis'
    condition: selection
falsepositives:
    - None known — .mollis is not a registered file extension
level: critical

