# ============================================================
# Sigma Rule: Logon/daily trigger task running user-path action
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1053.005
# ============================================================
title: Scheduled Task with Logon or Daily Trigger Executing from User-Writable Path
id: 3a9c5e07-6d1f-4be8-82ca-9e5a3d8b1b69
status: experimental
description: >
    Generic behavioral layer beneath the task-name rule: schtasks /Create
    with ONLOGON or DAILY trigger whose action points into a user-writable
    directory — the shape of the RedFlick persistence tasks (DAILY 09:30 and
    ONLOGON) and of most malware installers.
references:
    - https://attack.mitre.org/techniques/T1053/005/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.persistence
    - attack.t1053.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/Create'
    selection_trigger:
        CommandLine|contains:
            - '/SC ONLOGON'
            - '/SC DAILY'
            - '/SC ONSTART'
    selection_user_action:
        CommandLine|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\ProgramData\'
    condition: all of selection_*
falsepositives:
    - User-authored legitimate automation and per-user updater tasks
level: medium

