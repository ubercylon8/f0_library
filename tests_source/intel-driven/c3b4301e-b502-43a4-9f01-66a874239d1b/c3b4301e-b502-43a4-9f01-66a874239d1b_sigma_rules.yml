# ============================================================
# Sigma Rule: Python runtime and bootstrapper archives staged in update folder
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1071.001, T1105
# ============================================================
title: Python Runtime and Bootstrapper Archives Staged in App Update Subdirectory
id: 7e3a9c4b-1b5d-4f2c-860e-3c9e7b2f5f0d
status: experimental
description: >
    Staging of python38.zip and bootstrapper.zip archives into a \bin\update
    subdirectory of a video-conference-app-style folder under user-writable
    paths — the CosmicPulse installer prep that lays a portable Python 3.8
    runtime before the backdoor is dropped.
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1105
logsource:
    category: file_event
    product: windows
detection:
    selection_files:
        TargetFilename|endswith:
            - '\python38.zip'
            - '\bootstrapper.zip'
    selection_path:
        TargetFilename|contains:
            - '\AppData\'
            - '\Users\'
            - '\Temp\'
            - '\ProgramData\'
    selection_update_dir:
        TargetFilename|contains:
            - '\bin\update'
            - '\update'
    condition: 1 of selection_files_* and selection_path and selection_update_dir
falsepositives:
    - Legitimate video-conference clients and portable Python tooling shipping update folders
level: medium
