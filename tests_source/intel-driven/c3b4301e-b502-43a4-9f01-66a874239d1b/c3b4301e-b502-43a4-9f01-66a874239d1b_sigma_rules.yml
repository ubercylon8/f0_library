# ============================================================
# Sigma Rule: curl.exe with spoofed browser User-Agent or agent-poll URL
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1071.001
# ============================================================
title: curl.exe Beaconing with Spoofed Browser User-Agent to Poll Endpoint with ID Parameter
id: 6d2f8b3a-0a4c-4e1b-95fd-2b8d6a1e4e9c
status: experimental
description: >
    The CosmicPulse registration/poll beacon: curl.exe invoked with an
    explicitly set browser User-Agent (-A/--user-agent spoofing Edge/Chrome)
    and/or GET requests to agent-poll-style paths carrying an id= parameter
    that encodes UTF-16LE+Base64 "hostname|username" system profiling data.
references:
    - https://attack.mitre.org/techniques/T1071/001/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.defense_evasion
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\curl.exe'
    selection_spoofed_ua:
        CommandLine|contains:
            - '-A '
            - '--user-agent'
        CommandLine|contains:
            - 'Mozilla/'
            - 'Edg/'
            - 'Chrome/'
    selection_poll_url:
        CommandLine|contains:
            - '/agent/poll'
            - '/agent/'
            - '/gate'
        CommandLine|contains:
            - 'id='
    condition: selection_image and 1 of selection_spoofed_ua_* or (selection_image and selection_poll_url)
falsepositives:
    - Developers testing endpoints with custom user agents
    - Monitoring scripts polling agent-style update endpoints
level: medium

