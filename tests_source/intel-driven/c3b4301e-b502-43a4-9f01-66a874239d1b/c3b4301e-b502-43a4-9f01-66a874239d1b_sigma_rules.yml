# ============================================================
# Sigma Rule: WScript.Shell-built LNK targeting hidden conhost.exe
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1204.002
# ============================================================
title: Weaponized LNK Creation via WScript.Shell Targeting conhost.exe Headless Chain
id: 6f2b8d30-9c4e-4a71-8b53-2d8f6e1c4a92
status: experimental
description: >
    Detects PowerShell using the WScript.Shell COM interface (CreateShortcut)
    to build a shortcut whose target is conhost.exe with a --headless argument
        and hidden WindowStyle — the construction pattern of the RedFlick lure LNK
    that launches a hidden cmd.exe chain without a console window flash.
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.execution
    - attack.t1204.002
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_pwsh:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_com:
        CommandLine|contains:
            - 'WScript.Shell'
            - 'CreateShortcut'
    selection_target:
        CommandLine|contains:
            - 'conhost.exe'
    selection_hidden:
        CommandLine|contains:
            - '--headless'
            - 'WindowStyle'
    condition: all of selection_*
falsepositives:
    - Legitimate installer scripts creating shortcuts (very rarely target conhost.exe)
level: high

---
# ============================================================
# Sigma Rule: conhost.exe executed explicitly with --headless
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1204.002, T1059.003
# ============================================================
title: Explicit conhost.exe Execution with Headless Flag Spawning cmd.exe
id: 7a3c9e41-0d5f-4b82-9c64-3e9a7f2d5b03
status: experimental
description: >
    conhost.exe is normally spawned implicitly by the OS. An explicit
    conhost.exe process creation carrying --headless that spawns cmd.exe to
    run a script is the RedFlick no-window execution primitive launched from
    the malicious LNK.
references:
    - https://attack.mitre.org/techniques/T1204/002/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\conhost.exe'
        CommandLine|contains:
            - '--headless'
    selection_chain:
        CommandLine|contains:
            - 'cmd.exe'
            - '.bat'
            - '.cmd'
    condition: selection and 1 of selection_chain_*
falsepositives:
    - Extremely rare; some terminal emulation tooling
level: high

