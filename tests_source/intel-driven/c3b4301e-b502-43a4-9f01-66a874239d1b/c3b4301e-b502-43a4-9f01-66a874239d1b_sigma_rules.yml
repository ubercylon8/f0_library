# ============================================================
# Sigma Rule: PowerShell base64 extraction and execution from a document
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1059.001
# ============================================================
title: PowerShell Reads Document, Decodes Base64 and Invoke-Expressions Result
id: 0d6f2b74-3a8c-4eb5-8f97-6b2d0a5e8e36
status: experimental
description: >
    Detects PowerShell reading a PDF/document from disk via
    [IO.File]::ReadAllText, decoding an embedded base64 blob with
    [Convert]::FromBase64String and executing it with Invoke-Expression —
    the RedFlick July-chain execution where a weaponized PDF carries a
    cAB-marked base64 command.
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_pwsh:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_read:
        CommandLine|contains:
            - 'ReadAllText'
            - 'Get-Content'
    selection_doc:
        CommandLine|contains:
            - '.pdf'
            - '.doc'
            - '.rtf'
    selection_decode:
        CommandLine|contains: 'FromBase64String'
    selection_exec:
        CommandLine|contains:
            - 'Invoke-Expression'
            - 'IEX '
    condition: all of selection_*
falsepositives:
    - Very rare; enterprise reporting tools reading documents do not base64-decode and IEX them
level: high

