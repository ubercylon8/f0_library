status: experimental
description: >
    rundll32.exe shell32.dll,Control_RunDLL (or control.exe) invoked against
    a .cpl file located in a user-writable path — the CosmicPulse execution
    surface driven by its scheduled task, including execution of remote
    DLLs/CPLs over WebDAV-style paths. Legitimate applets reside in System32.
references:
    - https://attack.mitre.org/techniques/T1218/011/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.defense_evasion
    - attack.t1218.011
logsource:
    category: process_creation
    product: windows
detection:
    selection_rundll:
        Image|endswith: '\rundll32.exe'
        CommandLine|contains:
            - 'Control_RunDLL'
            - 'shell32.dll'
    selection_control:
        Image|endswith: '\control.exe'
    selection_cpl_userpath:
        CommandLine|contains:
            - '.cpl'
        CommandLine|contains:
            - '\Users\'
            - '\AppData\'
            - '\Temp\'
            - '\Downloads\'
            - '\ProgramData\'
    condition: 1 of selection_rundll_* or (selection_control and selection_cpl_userpath)
falsepositives:
    - Rare hardware vendor control panel applets installed outside System32
level: high

