# ============================================================
# Sigma Rule: RedFlick persistence scheduled task names
# Test ID: c3b4301e-b502-43a4-9f01-66a874239d1b
# MITRE ATT&CK: T1053.005
# ============================================================
title: Scheduled Task Creation with RedFlick Masquerading Network Component Names
id: 2f8b4d96-5c0e-4ad7-91b9-8d4f2c7a0a58
status: experimental
description: >
    Detects creation of the scheduled tasks disclosed for the RedFlick
    persistence layer, using their real adversarial names masquerading as
    network components — "Internet Quality Test Connection", "Network
    Configuration Manager", "System Health Monitor" — registered with DAILY
    or ONLOGON triggers in user context.
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://www.microsoft.com/en-us/security/blog/2026/09/29/star-blizzard-refines-phishing-and-malware-delivery-with-the-redflick-technique/
author: F0RT1KA Detection Rules Generator
date: 2026/09/30
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.defense_evasion
    - attack.t1036.004
logsource:
    category: process_creation
    product: windows
detection:
    selection_image:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains: '/Create'
    selection_task:
        CommandLine|contains:
            - 'Internet Quality Test Connection'
            - 'Network Configuration Manager'
            - 'System Health Monitor'
    condition: all of selection_*
falsepositives:
    - None expected — these task names are not used by legitimate Windows or networking software
level: critical

