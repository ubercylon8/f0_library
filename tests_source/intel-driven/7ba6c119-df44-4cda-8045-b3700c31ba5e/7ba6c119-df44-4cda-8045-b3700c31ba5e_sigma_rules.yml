# ============================================================
# Sigma Rules: KslKatz BYOVD LSASS Credential Dumping Framework
# Test ID: 7ba6c119-df44-4cda-8045-b3700c31ba5e
# MITRE ATT&CK: T1543.003, T1112, T1068, T1003.001
# Source: https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
# ============================================================
# Detection philosophy:
#   kslkatz performs LSASS reads from kernel mode via the KslD.sys MmCopyMemory
#   primitive, bypassing LSA Protection (PPL) entirely. The OpenProcess-to-lsass
#   signal (Sysmon EID 10) is a LATE or ABSENT signal on a successful kslkatz run.
#   Prioritize detection of the BYOVD precursor chain (rules 1-3) over the
#   credential-access event (rule 4).
# ============================================================

---
title: KslD AllowedProcessName Registry Write by Non-Defender Process
id: a3f81c47-9d2e-4b5a-8e6f-1c0d7e3a9b4f
status: experimental
description: >
    Detects any process writing the AllowedProcessName registry value under a
    KslD-shaped Windows service key (HKLM\SYSTEM\...\Services\KslD). This is the
    primary kslkatz signal: the KslD driver uses a plain-string comparison against
    this value (an NT device path) for caller authentication. Writing it to an
    attacker-controlled path defeats the check with no further verification.
    The KslD service is NOT covered by Defender tamper protection — any local admin
    can write this value. A non-Defender process touching AllowedProcessName under
    Services\KslD has no legitimate baseline.
references:
    - https://attack.mitre.org/techniques/T1112/
    - https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
    - https://github.com/vergamota/KslKatz
author: F0RT1KA Detection Rules Generator
date: 2026-06-01
tags:
    - attack.defense_evasion
    - attack.t1112
    - attack.credential_access
    - attack.t1003.001
logsource:
    category: registry_event
    product: windows
detection:
    selection_value_name:
        EventType: SetValue
        TargetObject|contains: '\Services\KslD'
        Details|contains: 'AllowedProcessName'
    selection_value_name_alt:
        EventType: SetValue
        TargetObject|endswith: '\KslD\AllowedProcessName'
    filter_legitimate_defender:
        Image|endswith:
            - '\MsMpEng.exe'
            - '\HealthService.exe'
            - '\MpDefenderCoreService.exe'
            - '\TrustedInstaller.exe'
            - '\services.exe'
    condition: (selection_value_name or selection_value_name_alt) and not filter_legitimate_defender
falsepositives:
    - Microsoft Defender internal updates (filter on Image ending with MsMpEng.exe)
    - Windows Update installing Defender component patches (filter TrustedInstaller.exe)
level: critical

---
title: KslD Kernel Service ImagePath Redirected to Non-Protected Driver Path
id: b7d92e53-1a4f-4c8b-9f1e-2d5c8b0e4a6c
status: experimental
description: >
    Detects the ImagePath value of the KslD Defender kernel service being rewritten to
    a path outside the protected Windows Defender driver directory
    (\System32\drivers\wd\). KslKatz uses ChangeServiceConfigW to redirect ImagePath
    toward a vulnerable 333KB KslD.sys at an attacker-controlled location, enabling
    BYOVD exploitation. This service key is editable by any local admin and is NOT
    protected by Defender tamper protection.
    Real path: HKLM\SYSTEM\CurrentControlSet\Services\KslD
references:
    - https://attack.mitre.org/techniques/T1543.003/
    - https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
author: F0RT1KA Detection Rules Generator
date: 2026-06-01
tags:
    - attack.persistence
    - attack.t1543.003
    - attack.defense_evasion
    - attack.t1068
logsource:
    category: registry_event
    product: windows
detection:
    selection_ksld_imagepath:
        EventType: SetValue
        TargetObject|endswith: '\KslD\ImagePath'
    filter_protected_path:
        # Legitimate KslD.sys resides under \drivers\wd\
        Details|contains:
            - '\drivers\wd\'
            - '\System32\drivers\wd\'
    filter_legitimate_writers:
        Image|endswith:
            - '\TrustedInstaller.exe'
            - '\MsMpEng.exe'
            - '\services.exe'
            - '\MpDefenderCoreService.exe'
    condition: selection_ksld_imagepath and not filter_protected_path and not filter_legitimate_writers
falsepositives:
    - Legitimate Microsoft Defender updates that change the KslD driver path (very rare)
    - Windows Update component repair (TrustedInstaller.exe — filtered above)
level: high

---
title: KslD.sys Vulnerable Driver Dropped Outside Protected Windows Driver Directory
id: c9e04d61-2b5a-4d9c-af2e-3e6d9c1f5b7d
status: experimental
description: >
    Detects the creation of a file named KslD.sys (or variant names such as vKslD.sys)
    at any path outside the protected Windows Defender driver directory. KslKatz deploys
    a no-fix Microsoft-signed vulnerable KslD.sys (~333KB) to an attacker-controlled
    location before starting the service. The file being Microsoft-signed does not
    exclude it from this detection — BYOVD specifically weaponizes legitimately signed
    drivers.
    Note: The Microsoft Vulnerable Driver Blocklist includes hash-based blocks for
    known-vulnerable drivers. Complement this path-based rule with hash-based detections
    from the Blocklist.
references:
    - https://attack.mitre.org/techniques/T1068/
    - https://learn.microsoft.com/en-us/windows/security/threat-protection/windows-defender-application-control/microsoft-recommended-driver-block-rules
    - https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
author: F0RT1KA Detection Rules Generator
date: 2026-06-01
tags:
    - attack.privilege_escalation
    - attack.t1068
    - attack.defense_evasion
logsource:
    category: file_event
    product: windows
detection:
    selection_driver_filename:
        TargetFilename|endswith:
            - '\KslD.sys'
            - '\vKslD.sys'
            - '\ksld.sys'
    filter_protected_location:
        TargetFilename|contains:
            - '\System32\drivers\wd\'
            - '\SysWOW64\drivers\wd\'
    filter_known_good_writers:
        Image|endswith:
            - '\TrustedInstaller.exe'
            - '\WaaSMedicAgent.exe'
            - '\MsMpEng.exe'
    condition: selection_driver_filename and not filter_protected_location and not filter_known_good_writers
falsepositives:
    - Legitimate Defender component installation moving KslD.sys (TrustedInstaller — filtered above)
    - Security researcher tooling in controlled lab environments
level: high

---
title: LSASS Memory Access with VM_READ by Non-Whitelisted Process
id: d2f15e74-3c6b-4e0d-b03f-4f7ea2d06c8e
status: experimental
description: >
    Detects a process requesting PROCESS_VM_READ access to lsass.exe via OpenProcess.
    This is the classical EDR signal for credential dumping (Sysmon EID 10 / MDE
    DeviceEvents OpenProcessApiCall).

    IMPORTANT CAVEAT for kslkatz attribution:
    kslkatz reads LSASS memory from KERNEL MODE via the KslD.sys MmCopyMemory primitive,
    bypassing LSA Protection (PPL) entirely because the read originates in ring 0.
    A SUCCESSFUL kslkatz run will NOT generate a user-mode OpenProcess event.
    This detection catches:
      (a) Non-kslkatz credential dumpers (Mimikatz user-mode, ProcDump, etc.)
      (b) The kslkatz fallback/non-PPL-bypass path
      (c) Test simulations exercising the OpenProcess access primitive
    For kslkatz-specific attribution, correlate with the BYOVD precursor chain rules
    (AllowedProcessName write, ImagePath redirect, KslD.sys driver drop) which fire
    BEFORE credential extraction.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
author: F0RT1KA Detection Rules Generator
date: 2026-06-01
tags:
    - attack.credential_access
    - attack.t1003.001
logsource:
    # Sysmon Event ID 10 (ProcessAccess)
    category: process_access
    product: windows
detection:
    selection_lsass_access:
        TargetImage|endswith: '\lsass.exe'
        GrantedAccess|contains:
            # PROCESS_VM_READ (0x0010) alone or in combination with QUERY_INFORMATION (0x0400).
            - '0x1010'
            - '0x0010'
            - '0x1410'
            - '0x143a'
            - '0x1fffff'
    filter_legitimate_callers:
        SourceImage|endswith:
            - '\MsMpEng.exe'
            - '\csrss.exe'
            - '\werfault.exe'
            - '\WerFault.exe'
            - '\svchost.exe'
            - '\taskmgr.exe'
            - '\perfmon.exe'
            - '\MpDefenderCoreService.exe'
            - '\SenseIR.exe'
            - '\SenseCncProxy.exe'
            - '\SecurityHealthService.exe'
    condition: selection_lsass_access and not filter_legitimate_callers
falsepositives:
    - EDR and AV products (tune the filter_legitimate_callers list for your environment)
    - Windows Debuggers (WinDbg, cdb) in developer environments
    - Crash dump tools (procdump from sysadmins with approval)
    - SIEM/EDR agent itself accessing lsass for telemetry enrichment
level: high

---
title: KslKatz BYOVD Full Kill-Chain — Registry Tamper and Driver Drop Correlation
id: e5a26f85-4d7c-4f1e-c14g-5g8fb3e17d9f
status: experimental
description: >
    High-confidence correlation rule: fires when AllowedProcessName or ImagePath is
    written under a Services\KslD registry key AND a KslD.sys file is created outside
    the protected driver directory within a 30-minute window on the same host.
    This specific combination has no legitimate baseline and is highly specific to
    the kslkatz BYOVD attack chain. Triggers incident-response priority response.
references:
    - https://attack.mitre.org/techniques/T1543.003/
    - https://attack.mitre.org/techniques/T1112/
    - https://attack.mitre.org/techniques/T1068/
    - https://detect.fyi/ghost-in-lsass-detecting-kslkatz-credential-dumping-framework-8645f246aec9
author: F0RT1KA Detection Rules Generator
date: 2026-06-01
tags:
    - attack.persistence
    - attack.t1543.003
    - attack.defense_evasion
    - attack.t1112
    - attack.privilege_escalation
    - attack.t1068
    - attack.credential_access
    - attack.t1003.001
logsource:
    # This rule is intended for SIEM correlation across registry_event and file_event.
    # Implement as a correlated detection spanning two log source categories.
    product: windows
    category: registry_event
detection:
    # Note: Full correlated detection across registry_event + file_event is backend-specific.
    # This sigma rule captures the registry component; correlate with file_event rule (id: c9e04d61)
    # in your SIEM for the combined kill-chain signal.
    selection_registry_tamper:
        EventType: SetValue
        TargetObject|contains: '\Services\KslD'
        Details|contains:
            - 'AllowedProcessName'
            - 'ImagePath'
    filter_legitimate:
        Image|endswith:
            - '\MsMpEng.exe'
            - '\TrustedInstaller.exe'
            - '\services.exe'
    condition: selection_registry_tamper and not filter_legitimate
falsepositives:
    - Microsoft Defender updates (extremely rare to modify both values simultaneously)
level: critical
