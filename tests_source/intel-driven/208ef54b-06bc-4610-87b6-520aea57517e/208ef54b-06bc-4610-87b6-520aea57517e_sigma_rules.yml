# ============================================================================
# Sigma Rules — ScreenConnect Unsanctioned RMM Abuse for Third-Party Access
# UUID: 208ef54b-06bc-4610-87b6-520aea57517e
# Techniques: T1199, T1219, T1543.003, T1567.002 | Actor: Black Basta
#
# Detection philosophy: ScreenConnect is a legitimate vendor-signed RMM. These
# rules detect UNSANCTIONED install/service/relay/exfil behavior, not the vendor
# binary itself. Add environment allow-lists (sanctioned instance-id, relay host,
# deploying account) to the falsepositives/filter as noted per rule.
# ============================================================================

title: ScreenConnect RMM Silent MSI Install (Unsanctioned)
id: 3f8a1c22-208e-4b06-9a11-208ef54b0001
status: experimental
description: Detects a silent (/qn) msiexec install of a ScreenConnect/ConnectWise RMM access agent, the T1219 detonation signal of unsanctioned remote-access deployment.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-025a
    - https://attack.mitre.org/techniques/T1219/
author: sectest-builder
date: 2026/07/07
tags:
    - attack.command-and-control
    - attack.t1219
    - attack.t1199
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        - Image|endswith: '\msiexec.exe'
        - OriginalFileName: 'msiexec.exe'
    selection_silent:
        CommandLine|contains:
            - '/qn'
            - '/quiet'
            - '/passive'
    selection_rmm:
        CommandLine|contains:
            - 'screenconnect'
            - 'connectwise'
            - 'ScreenConnect.ClientSetup'
    condition: all of selection_*
falsepositives:
    - Sanctioned RMM deployment by IT (allow-list the deploying service account / package path)
level: high

---
title: ScreenConnect Client Windows Service Created
id: 3f8a1c22-208e-4b06-9a11-208ef54b0002
status: experimental
description: Detects creation of a Windows service named "ScreenConnect Client (<instance-id>)" — durable third-party remote access (T1543.003). The instance-id ties the service to a specific ScreenConnect relay.
references:
    - https://attack.mitre.org/techniques/T1543/003/
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-131a
author: sectest-builder
date: 2026/07/07
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    product: windows
    service: system
detection:
    selection_7045:
        Provider_Name: 'Service Control Manager'
        EventID: 7045
        ServiceName|startswith: 'ScreenConnect Client'
    condition: selection_7045
falsepositives:
    - Sanctioned ScreenConnect instance (allow-list your instance-id in the service name)
level: high

