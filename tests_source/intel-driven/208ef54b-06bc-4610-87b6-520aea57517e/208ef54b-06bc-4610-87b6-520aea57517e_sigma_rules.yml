---
title: ScreenConnect Agent Relay Egress
id: 3f8a1c22-208e-4b06-9a11-208ef54b0004
status: experimental
description: Detects the ScreenConnect access agent establishing an outbound relay/session connection. High-signal on any host where ScreenConnect is not the sanctioned RMM.
references:
    - https://attack.mitre.org/techniques/T1219/
author: sectest-builder
date: 2026/07/07
tags:
    - attack.command-and-control
    - attack.t1219
logsource:
    category: network_connection
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\ScreenConnect.ClientService.exe'
            - '\ScreenConnect.WindowsClient.exe'
    selection_dst:
        DestinationPort:
            - 443
            - 8041
    condition: selection_img and selection_dst
falsepositives:
    - Sanctioned ScreenConnect usage (allow-list your relay host / instance)
level: high

---
title: Follow-on Collection Archive From RMM Foothold
id: 3f8a1c22-208e-4b06-9a11-208ef54b0005
status: experimental
description: Detects creation of a compressed archive of collected data by a ScreenConnect agent or a shell it spawns, a precursor to cloud-storage exfiltration (T1567.002).
references:
    - https://attack.mitre.org/techniques/T1567/002/
author: sectest-builder
date: 2026/07/07
tags:
    - attack.exfiltration
    - attack.t1567.002
logsource:
    category: file_event
    product: windows
detection:
    selection_archive:
        TargetFilename|endswith:
            - '.zip'
            - '.7z'
            - '.rar'
    selection_parent:
        Image|contains:
            - 'ScreenConnect'
            - '\powershell.exe'
            - '\cmd.exe'
    condition: selection_archive and selection_parent
falsepositives:
    - Legitimate backup/archival tooling (tune to environment baselines)
level: medium
