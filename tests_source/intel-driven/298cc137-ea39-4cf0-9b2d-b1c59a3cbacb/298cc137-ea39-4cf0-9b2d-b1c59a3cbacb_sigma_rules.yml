title: Windows Defender Real-Time Protection Disabled
id: 4a7e2d96-8c5f-4a1d-9b3e-6f0c5d8a2e17
status: experimental
description: Detects PowerShell Set-MpPreference tampering or DisableAntiSpyware policy registry writes disabling Defender protection
references:
    - https://attack.mitre.org/techniques/T1562/001/
author: sectest-builder
date: 2026-10-01
logsource:
    category: process_creation
    product: windows
detection:
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_cmd:
        CommandLine|contains: 'Set-MpPreference'
    selection_tamper:
        CommandLine|contains:
            - 'DisableRealtimeMonitoring $true'
            - 'DisableRealtimeMonitoring 1'
            - 'DisableBehaviorMonitoring $true'
            - 'DisableIOAVProtection $true'
            - 'DisableScriptScanning $true'
    condition: selection_ps and selection_cmd and selection_tamper
falsepositives:
    - Managed security-baseline rollouts (filter to interactive users)
level: high
tags:
    - attack.defense_evasion
    - attack.t1562.001
    - attack.persistence
    - attack.t1112
