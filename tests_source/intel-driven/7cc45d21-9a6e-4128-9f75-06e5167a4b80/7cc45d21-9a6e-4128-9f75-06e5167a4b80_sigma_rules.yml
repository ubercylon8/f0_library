title: Masqueraded Scheduled Task Created to Run as SYSTEM at High Frequency
id: 7a9e8f4c-4f3b-4c5d-8a7e-6b8cdef07b5b
status: experimental
description: Detects schtasks /create registering a task to run as SYSTEM on a minute-scale schedule or launching a binary from Temp/staging paths, including the actor's masqueraded task name WindowsConnSvc (T1053.005) — The Gentlemen's persistence shape (schtasks /create /tn WindowsConnSvc /tr C:\Windows\Temp\svchost32.exe ... /sc minute /mo 2 /ru SYSTEM)
references:
    - https://attack.mitre.org/techniques/T1053/005/
    - https://www.huntress.com/blog/the-gentlemen-ransomware-defense-evasion-ttps
author: sectest-builder
date: 2026-11-02
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - '/ru'
            - 'SYSTEM'
    selection_masq:
        CommandLine|contains:
            - 'WindowsConnSvc'
            - 'svchost32'
    selection_schedule:
        CommandLine|contains:
            - '/sc minute'
            - '/mo 1'
            - '/mo 2'
            - '\Windows\Temp\'
            - '\Users\Public\'
    condition: selection_img and 1 of (selection_masq, selection_schedule)
falsepositives:
    - Rare — minute-frequency SYSTEM tasks launching from Temp are not legitimate IT practice
level: high
tags:
    - attack.persistence
    - attack.t1053.005
    - attack.privilege_escalation
