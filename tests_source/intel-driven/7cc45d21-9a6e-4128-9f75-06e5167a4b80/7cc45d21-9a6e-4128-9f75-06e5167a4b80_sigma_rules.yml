title: Remote Access Tool Executed from Non-Standard or Staging Path
id: 6b8f7a3d-4a2c-4d4e-9b6f-5c7a8b9ca3b6
status: experimental
description: Detects execution of remote-access tooling (Velociraptor, AnyDesk, Cloudflared) outside Program Files, or any executable run from trusted-but-rarely-used staging directories such as C:\PerfLogs (T1036/T1219) — The Gentlemen stages its masqueraded C2 client in PerfLogs-style paths
references:
    - https://attack.mitre.org/techniques/T1036/
    - https://www.sophos.com/en-us/blog/ungentlemanly-behavior-insights-into-a-ransomware-operation
author: sectest-builder
date: 2026-11-02
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool:
        Image|endswith:
            - '\velociraptor.exe'
            - '\velociraptorClient.exe'
            - '\anydesk.exe'
            - '\cloudflared.exe'
    filter_programfiles:
        Image|startswith:
            - 'C:\Program Files'
            - 'C:\Program Files (x86)'
    selection_staging:
        Image|endswith: '.exe'
        Image|contains:
            - '\PerfLogs\'
            - '\Windows\Temp\'
            - '\Users\Public\'
    condition: (selection_tool and not filter_programfiles) or selection_staging
falsepositives:
    - Sanctioned portable tooling on admin workstations
    - Software installers using Temp staging directories
level: high
tags:
    - attack.command_and_control
    - attack.t1219
    - attack.defense_evasion
    - attack.t1036
    - attack.t1036.005
