title: Security Software Enumeration via SecurityCenter2 WMI
id: 1f3a2c8e-4b7d-4e9a-8c1f-0d2b3a4c5e61
status: experimental
description: Detects wmic or PowerShell enumeration of installed antivirus products via root\SecurityCenter2 AntiVirusProduct (T1518.001) — The Gentlemen's pre-evasion endpoint-protection fingerprinting
references:
    - https://attack.mitre.org/techniques/T1518/001/
    - https://www.trendmicro.com/en_us/research/25/i/unmasking-the-gentlemen-ransomware.html
author: sectest-builder
date: 2026-11-02
logsource:
    category: process_creation
    product: windows
detection:
    selection_wmic:
        Image|endswith: '\wmic.exe'
        CommandLine|contains|all:
            - 'SecurityCenter2'
            - 'AntiVirusProduct'
    selection_ps:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains|all:
            - 'SecurityCenter2'
            - 'AntiVirusProduct'
    condition: selection_wmic or selection_ps
falsepositives:
    - Asset-inventory and compliance scripts
    - Sanctioned DFIR collectors
level: high
tags:
    - attack.discovery
    - attack.t1518.001
