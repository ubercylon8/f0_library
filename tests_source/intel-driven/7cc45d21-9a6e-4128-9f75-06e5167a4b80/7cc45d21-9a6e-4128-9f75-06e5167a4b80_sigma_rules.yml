title: Velociraptor Client Network Connection to Frontend Port (Sysmon 3)
id: 3a5e4f0c-4f9b-4c2d-8a4e-2b4c3456deb1
status: experimental
description: Detects a Velociraptor process initiating outbound network connections to default frontend ports 8000/8800 (Sysmon network-connection events, T1219) — beaconing of the Velociraptor client The Gentlemen repurposes as C2
references:
    - https://attack.mitre.org/techniques/T1219/
author: sectest-builder
date: 2026-11-02
logsource:
    category: network_connection
    product: windows
detection:
    selection:
        Image|endswith:
            - '\velociraptor.exe'
            - '\velociraptorClient.exe'
        DestinationPort:
            - 8000
            - 8800
    condition: selection
falsepositives:
    - Sanctioned Velociraptor DFIR deployments — allowlist approved frontend destinations
level: medium
tags:
    - attack.command_and_control
    - attack.t1219
