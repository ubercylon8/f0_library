id: 1e3c2d8a-4d7f-4a9b-8e1c-0f2a1234bf9f
status: experimental
description: Detects addition of a member to a domain security group or local group named Administrators (Events 4728/4732) — the elevation step of The Gentlemen's net user <name> <password> /add then net localgroup administrators <name> /add sequence; correlate with a preceding 4720 from the same subject
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://www.sophos.com/en-us/blog/ungentlemanly-behavior-insights-into-a-ransomware-operation
author: sectest-builder
date: 2026-11-02
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID:
            - 4728
            - 4732
        TargetUserName|contains:
            - 'Admin'
    condition: selection
falsepositives:
    - Legitimate privilege grants by delegated administrators — verify against change management
level: medium
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.privilege_escalation
    - attack.t1078
---
title: Local Account Creation then Administrators Elevation via net.exe
id: 2f4d3e9b-4e8a-4b0c-9f2d-1a3b2345cda0
status: experimental
description: Detects the net.exe shape of The Gentlemen's account-escalation sequence — net user <name> <password> /add followed by net localgroup administrators <name> /add (T1136.001) — the process-creation complement to Events 4720/4728
references:
    - https://attack.mitre.org/techniques/T1136/001/
    - https://www.sophos.com/en-us/blog/ungentlemanly-behavior-insights-into-a-ransomware-operation
author: sectest-builder
date: 2026-11-02
logsource:
    category: process_creation
    product: windows
detection:
    selection_create:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'user'
            - '/add'
    selection_elevate:
        Image|endswith:
            - '\net.exe'
            - '\net1.exe'
        CommandLine|contains|all:
            - 'localgroup'
            - 'administrators'
            - '/add'
    condition: selection_create or selection_elevate
falsepositives:
    - Helpdesk account provisioning — allowlist privileged-access workflow accounts
level: high
tags:
    - attack.persistence
    - attack.t1136.001
    - attack.privilege_escalation
