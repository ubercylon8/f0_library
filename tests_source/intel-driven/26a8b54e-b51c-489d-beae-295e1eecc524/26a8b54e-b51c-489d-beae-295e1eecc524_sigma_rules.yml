id: e2a7c94f-6b3d-4518-9e8a-4c7b2f9d3e65
status: experimental
description: 'Detects collection of KeePass .kdbx databases, Firefox Gecko credential stores (key4.db, logins.json) and the MetaMask wallet extension storage directory (nkbihfbeogaeaoehlefnkodbefgpgknn) by processes other than the legitimate managers — wholesale harvesting documented for the Lumma MaaS.'
references:
    - https://attack.mitre.org/techniques/T1555/
    - https://attack.mitre.org/techniques/T1005/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
    - attack.credential_access
    - attack.t1555
    - attack.collection
    - attack.t1005
logsource:
    category: file_event
    product: windows
detection:
    selection_stores:
        TargetFilename|endswith:
            - '.kdbx'
            - '\key4.db'
            - '\logins.json'
            - '\signons.sqlite'
    selection_wallet:
        TargetFilename|contains: 'nkbihfbeogaeaoehlefnkodbefgpgknn'
    filter_managers:
        Image|endswith:
            - '\keepass.exe'
            - '\keepassxc.exe'
            - '\firefox.exe'
            - '\chrome.exe'
            - '\msedge.exe'
    condition: 1 of selection_* and not 1 of filter_*
falsepositives:
    - Password-manager sync/backup agents (allowlist by signer)
    - Wallet browser extensions writing their own storage (filtered by browser image)
level: high
