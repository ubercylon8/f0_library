title: ClickFix Cradle - Hidden Encoded PowerShell Download
id: 6f2c9e41-a8d3-4b7e-9c52-1e8f7a3d5b84
status: experimental
description: 'Detects the ClickFix (fake CAPTCHA) delivery primitive: hidden-window encoded-command PowerShell launched after clipboard poisoning, typically pasted by the victim into Win+R — the documented LummaC2/Water Kurita initial access.'
references:
    - https://www.nccgroup.com/research/fake-captcha-led-to-lumma/
    - https://attack.mitre.org/techniques/T1204/002/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
    - attack.execution
    - attack.t1204.002
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
    selection_enc:
        CommandLine|contains:
            - '-encodedcommand'
            - ' -enc '
    selection_hidden:
        CommandLine|contains:
            - '-windowstyle hidden'
            - '-w hidden'
            - '-window hidden'
            - ' -wh '
    condition: all of selection_*
falsepositives:
    - Legitimate software deployment agents using encoded commands (baseline signed management tools)
    - Restrict to parent explorer.exe (Win+R paste path) to reduce noise
level: high
