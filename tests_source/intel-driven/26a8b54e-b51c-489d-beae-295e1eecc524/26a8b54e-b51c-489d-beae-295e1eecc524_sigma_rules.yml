title: LummaC2 Communication - TeslaBrowser User-Agent or c2sock Handshake
id: 9b6d2f8e-4a1c-4d97-b3e5-7f8a2c6d9e04
status: experimental
description: 'Detects the documented LummaC2 exfiltration channel: hardcoded User-Agent "TeslaBrowser/5.5", the /c2sock endpoint with act=live handshake and LID/J form parameters, or multipart upload of archive.zip to the panel (Darktrace PCAP, ESET teardown, malpedia).'
references:
    - https://attack.mitre.org/techniques/T1041/
    - https://attack.mitre.org/techniques/T1071/001/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
    - attack.exfiltration
    - attack.t1041
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: proxy
detection:
    selection_ua:
        UserAgent|startswith: 'TeslaBrowser'
    selection_uri:
        c-uri|contains:
            - '/c2sock'
            - 'act=live'
    condition: 1 of selection_*
falsepositives:
    - None expected — the User-Agent and handshake URI are actor-specific
level: critical
