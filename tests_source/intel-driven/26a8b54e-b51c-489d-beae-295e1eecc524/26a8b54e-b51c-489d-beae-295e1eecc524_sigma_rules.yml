title: Browser Credential Store Files Copied by Non-Browser Process
id: b5f8a3d2-7c64-4e19-8a3b-6d9c4f2e1a07
status: experimental
description: 'Detects a non-browser process creating/copying Chromium credential stores (Login Data, Network Cookies, Web Data, Local State) — the Lumma stealer chain that copies locked SQLite DBs to a scratch directory before DPAPI key unwrap and AES-GCM v10 decryption.'
references:
    - https://www.nccgroup.com/research/fake-captcha-led-to-lumma/
    - https://attack.mitre.org/techniques/T1555/003/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
    - attack.credential_access
    - attack.t1555.003
logsource:
    category: file_event
    product: windows
detection:
    selection_target:
        TargetFilename|endswith:
            - '\Login Data'
            - '\Cookies'
            - '\Web Data'
            - '\Local State'
    selection_scratch:
        TargetFilename|contains:
            - '\AppData\Local\Temp\'
            - '\Temp\'
            - 'C:\Users\Public\'
    filter_browser:
        Image|endswith:
            - '\chrome.exe'
            - '\msedge.exe'
            - '\firefox.exe'
            - '\googleupdate.exe'
            - '\microsoftedgeupdate.exe'
            - '\setup.exe'
    condition: all of selection_* and not 1 of filter_*
falsepositives:
    - Browser profile backup and migration tools (allowlist by signer)
    - Forensic/DFIR collectors targeting profile directories
level: high
