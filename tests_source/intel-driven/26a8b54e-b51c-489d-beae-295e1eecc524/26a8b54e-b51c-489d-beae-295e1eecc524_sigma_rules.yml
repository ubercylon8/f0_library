title: Browser Updater Masquerade Executed from User-Writable Path
id: 8c4e2b97-5d1a-4c83-b9f6-2a7e5c0d8e13
status: experimental
description: 'Detects MicrosoftEdgeUpdate.exe/GoogleUpdate.exe running outside Program Files — the Lumma injector pattern that copies itself as MicrosoftEdgeUpdate.exe into a user directory before remote-thread injection into chrome.exe (NCC Group / Gen Digital research).'
references:
    - https://www.nccgroup.com/research/fake-captcha-led-to-lumma/
    - https://attack.mitre.org/techniques/T1055/003/
    - https://attack.mitre.org/techniques/T1036/005/
author: F0RT1KA Detection Rules Generator
date: 2026-11-02
tags:
    - attack.defense_evasion
    - attack.t1055.003
    - attack.t1036.005
logsource:
    category: process_creation
    product: windows
detection:
    selection_img:
        Image|endswith:
            - '\microsoftedgeupdate.exe'
            - '\googleupdate.exe'
    selection_path:
        Image|contains:
            - 'C:\Users\'
            - '\AppData\'
            - '\Temp\'
    filter_legit_peruser_chrome:
        Image|contains: '\AppData\Local\Google\Update\GoogleUpdate.exe'
    condition: 1 of selection_* and not 1 of filter_*
falsepositives:
    - Per-user Chrome installs legitimately run GoogleUpdate.exe from %LOCALAPPDATA%\Google\Update (filtered); MicrosoftEdgeUpdate.exe has no legitimate user-path install
level: high
