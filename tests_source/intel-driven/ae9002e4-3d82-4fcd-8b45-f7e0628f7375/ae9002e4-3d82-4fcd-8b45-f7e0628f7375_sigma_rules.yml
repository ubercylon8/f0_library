title: Worm Workflow Injection / Exfil Marker
id: 9a1c0d11-0006-4a06-9006-aebc7f001006
status: experimental
description: Detects writes to GitHub Actions workflow/loader files by node/bun, or the distinctive GitHub-commit exfil marker string.
references:
  - https://socket.dev/blog/mini-shai-hulud-campaign-hits-red-hat-cloud-services-npm-packages
author: sectest-builder
date: 2026/06/01
tags:
  - attack.exfiltration
  - attack.t1567.001
  - attack.lateral_movement
  - attack.t1080
logsource:
  category: file_event
  product: linux
detection:
  selection_proc:
    Image|endswith:
      - '/node'
      - '/bun'
  selection_files:
    TargetFilename|contains:
      - '.github/workflows/codeql.yml'
      - '.github/setup.js'
  condition: selection_proc and selection_files
falsepositives:
  - Legitimate CI maintenance touching codeql.yml (correlate with install-time origin)
level: high
