title: TclBanker Scheduled Task RuntimeOptimizeService Created
id: 1a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects creation of TclBanker's signature scheduled task "RuntimeOptimizeService"
  via schtasks.exe or the COM Task Scheduler. Real TclBanker uses this exact name
  in the root task folder to maintain persistence at logon.
references:
    - https://www.elastic.co/security-labs/tclbanker-brazilian-banking-trojan
author: F0RT1KA
date: 2026-05-11
tags:
    - attack.persistence
    - attack.t1053.005
    - threat.tclbanker
logsource:
    category: process_creation
    product: windows
detection:
    selection_create:
        Image|endswith: '\schtasks.exe'
        CommandLine|contains|all:
            - '/create'
            - 'RuntimeOptimizeService'
    condition: selection_create
falsepositives:
    - Legitimate "RuntimeOptimizeService" tasks created by enterprise tooling (uncommon)
level: high
---
title: TclBanker LogiAiPromptBuilder Launched From Non-Standard Path
id: 2a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects LogiAiPromptBuilder.exe (TclBanker's renamed sideload host) running
  outside Logitech's legitimate install directory. Legitimate Logitech updates
  run from \Program Files\.
references:
    - https://www.elastic.co/security-labs/tclbanker-brazilian-banking-trojan
author: F0RT1KA
date: 2026-05-11
tags:
    - attack.defense_evasion
    - attack.t1574.002
    - threat.tclbanker
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\LogiAiPromptBuilder.exe'
    legit_paths:
        Image|startswith:
            - 'C:\Program Files\Logi'
            - 'C:\Program Files (x86)\Logi'
    condition: selection and not legit_paths
falsepositives:
    - User-installed Logitech tools that drop into non-standard paths (very rare)
level: high
---
