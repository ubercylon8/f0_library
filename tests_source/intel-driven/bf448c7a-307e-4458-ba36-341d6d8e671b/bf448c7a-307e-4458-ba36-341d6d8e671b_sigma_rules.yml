---
title: TclBanker Logitech_Update Branded MSI Dropped
id: 6a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects creation of MSI files matching the Logitech_Update_*.msi filename shape
  TclBanker uses for delivery, outside legitimate software-update paths.
references:
    - https://www.elastic.co/security-labs/tclbanker-brazilian-banking-trojan
author: F0RT1KA
date: 2026-05-11
tags:
    - attack.initial_access
    - attack.t1566.001
    - attack.t1218.007
    - threat.tclbanker
logsource:
    category: file_event
    product: windows
detection:
    selection:
        TargetFilename|re: '(?i)\\Logitech_Update_[\w\-]+\.msi$'
    legit_paths:
        TargetFilename|contains:
            - '\Program Files\'
            - '\Windows\Installer\'
    condition: selection and not legit_paths
level: medium
