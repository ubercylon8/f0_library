id: 5a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects creation of the distinctive TclBanker debug-artifact file
  C:\temp\tcl-debug.txt — present in TclBanker samples observed by Elastic.
references:
