title: TclBanker C2 HTTP Header X-Campaign-Id With Known Campaign GUID
id: 7a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects outbound HTTP/HTTPS requests with X-Campaign-Id header carrying
  TclBanker's campaign GUID 70e4f943-e323-4484-97d7-35401bf6812c, or the
  User-Agent string "Tcl.WppBot".
references:
    - https://www.elastic.co/security-labs/tclbanker-brazilian-banking-trojan
author: F0RT1KA
date: 2026-05-11
tags:
    - attack.command_and_control
    - attack.t1071.001
    - threat.tclbanker
logsource:
    category: proxy
    product: zeek
detection:
    sel_camp_id:
        request_header|contains: 'X-Campaign-Id: 70e4f943-e323-4484-97d7-35401bf6812c'
    sel_ua:
        UserAgent|contains: 'Tcl.WppBot'
    condition: 1 of sel_*
level: high
