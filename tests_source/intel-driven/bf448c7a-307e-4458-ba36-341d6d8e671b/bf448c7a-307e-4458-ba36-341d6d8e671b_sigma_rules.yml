title: TclBanker Cloudflare Workers C2 DNS Lookup
id: 4a2b3c4d-bf44-8c7a-3074-58ba36341d6d
status: experimental
description: >
  Detects DNS resolution attempts for *.workers.dev subdomains containing the
  TclBanker account identifier "ef971a42" or known TclBanker domain shapes.
references:
    - https://www.elastic.co/security-labs/tclbanker-brazilian-banking-trojan
author: F0RT1KA
date: 2026-05-11
tags:
    - attack.command_and_control
    - attack.t1071.001
    - attack.t1102
    - threat.tclbanker
logsource:
    category: dns
    product: windows
detection:
    selection_acct:
        query|contains:
            - 'ef971a42'
        query|endswith: '.workers.dev'
    selection_shape:
        query|contains:
            - 'tcl-banker'
            - 'tclbanker'
        query|endswith: '.workers.dev'
    condition: 1 of selection_*
falsepositives:
    - Cloudflare Workers traffic to legitimate Workers apps with matching substrings
level: high
