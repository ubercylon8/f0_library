title: Accepted TLS Chain Using a Compromised eMudhra Key
id: 3146787c-3ada-5faf-8e58-1a2b2e9229c5
status: experimental
description: >-
  Detects explicit TLS chain acceptance involving any of six compromised eMudhra
  public keys. ChainAccepted must come from a validator that actually built and
  trusted the chain; a completed TCP/TLS handshake alone does not prove acceptance.
references:
  - https://attack.mitre.org/techniques/T1557/
  - https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys
  - https://blog.cloudflare.com/emudhra-certificate-compromise
author: F0RT1KA Detection Rules Generator
date: 2026-11-14
tags:
  - attack.credential-access
  - attack.t1557
logsource:
  service: certificate-observations
detection:
  selection_usage:
    ObservedUsage: tls
    ChainAccepted: true
  selection_spki:
    SpkiSHA256:
      - EBED6475C2C2D80FCB199F3FE8DD6E6B3CE60B77EB15D4E42C3DEC0C6F5B5105
      - 43BFFA19D6EF651451F6841E019931E96F6F2EAEFF28AB4B6F1CE4576DE2717B
      - E0254C7FCDC265E2F0F8A428DABB75AB4AE039B4872D62F5EE57F0877D5A8A41
      - 49DD353DC2B919A3770645117D0E60C16115E7D1BC259EEFE734B00EA434FE5F
      - 63ECEFEE431D49523BC1136C4E72D0206A477086CAF606CD5CF025686C109CF8
      - 5C0660A2B164910D8FF589C18E14552E9E0EC237DCEFE2CB736D41A4811F81A0
  condition: selection_usage and selection_spki
falsepositives:
  - Deliberately vulnerable security-validation systems
  - Controlled incident-response testing; triage by host and validation source
level: critical
