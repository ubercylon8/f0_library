title: Accepted Authenticode Chain Using a Compromised eMudhra Key
id: fa4a264c-be76-5dff-8c8f-f28f5079113e
status: experimental
description: >-
  Detects explicit acceptance of an Authenticode signature chain using either
  compromised code-signing public key. ChainAccepted must be produced by real
  WinVerifyTrust/Authenticode or equivalent validation, not inferred from a signature
  being present. Properly timestamped legacy software still requires contextual triage.
references:
  - https://attack.mitre.org/techniques/T1553/002/
  - https://www.microsoft.com/en-us/msrc/blog/2026/10/microsoft-response-to-compromised-emudhra-certificate-authority-keys
  - https://blog.talosintelligence.com/compromised-intermediate-certificates/
author: F0RT1KA Detection Rules Generator
date: 2026-11-14
tags:
  - attack.defense-evasion
  - attack.t1553.002
logsource:
  service: certificate-observations
detection:
  selection_usage:
    ObservedUsage: code-signing
    ChainAccepted: true
  selection_spki:
    SpkiSHA256:
      - EC4FFA1AD0AC88081314B7AAFFEF6A91F97CD57291BB5BA686C5415F5EB4F6B6
      - 92C063D67E8F14DB71D288E11266FFDAF69CBF115F7BAB14F3BC2F68D25E0E30
  condition: selection_usage and selection_spki
falsepositives:
  - Properly timestamped legacy software that local policy continues to trust
  - Deliberately vulnerable security-validation systems
level: critical
