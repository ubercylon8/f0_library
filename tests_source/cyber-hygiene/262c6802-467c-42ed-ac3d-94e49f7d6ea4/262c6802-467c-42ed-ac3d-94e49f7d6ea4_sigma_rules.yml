# eMudhra compromised CA detection rules
# Test ID: 262c6802-467c-42ed-ac3d-94e49f7d6ea4
# These rules intentionally use a documented custom certificate-observation logsource.
# Sigma's standard process/file/network fields do not expose all certificates in a
# presented chain or a validator's chain-acceptance result. Ingest one event per
# observed certificate with the fields below; do not substitute process creation,
# loopback network events, or certificate filenames as proof of compromise.
# Required custom fields: ObservedUsage (tls|code-signing), CertificateSHA256,
# SpkiSHA256, ChainAccepted (boolean, only when actually validated), Subject, Issuer,
# SerialNumber, Source, FilePath, RemoteHost.
---
title: Compromised eMudhra TLS Intermediate Certificate or Key Observed
id: 60f12172-bd01-5650-8c5d-c41cb3ce8779
status: experimental
description: >-
  Detects any of the 12 direct or Sectigo AAA cross-signed compromised TLS
  intermediate certificates by DER SHA-256, or their six public keys by DER SPKI
  SHA-256. Requires normalized certificate-chain observations from a TLS sensor,
  certificate scanner, or equivalent telemetry; this is not a process rule.
references:
  - https://attack.mitre.org/techniques/T1557/
  - https://emudhra.we-have-a-problem.com/
  - https://blog.cloudflare.com/emudhra-certificate-compromise
  - https://blog.talosintelligence.com/compromised-intermediate-certificates/
author: F0RT1KA Detection Rules Generator
date: 2026-11-14
tags:
  - attack.credential-access
  - attack.t1557
logsource:
  service: certificate-observations
detection:
  selection_usage:
